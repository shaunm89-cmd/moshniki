<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Panthers Game Finder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
    --bg-main:#020617;
    --bg-elevated:rgba(15,23,42,0.96);
    --bg-elevated-soft:rgba(15,23,42,0.9);
    --border-subtle:#1f2937;
    --accent:#38bdf8;
    --accent-soft:#0ea5e9;
    --accent-gold:#fbbf24;
    --text-main:#e5e7eb;
    --text-muted:#9ca3af;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:9px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text-main);
    background-color:var(--bg-main);
    background-image:url("panthers_bg.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    align-items:stretch;
    overflow:hidden;
    position:relative;
    font-size:14px;
}
body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at top left, rgba(56,189,248,0.15), transparent 55%),
        radial-gradient(circle at bottom right, rgba(15,23,42,0.9), rgba(3,7,18,0.98));
    pointer-events:none;
    mix-blend-mode:soft-light;
}
body::after{
    content:"";
    position:fixed;
    inset:0;
    background:linear-gradient(to bottom right, rgba(15,23,42,0.92), rgba(15,23,42,0.85));
    mix-blend-mode:multiply;
    pointer-events:none;
}
.app-shell{
    position:relative;
    z-index:1;
    width:100%;
    max-width:1500px;
    height:100vh;
    padding:26px 32px 26px;
    display:flex;
    flex-direction:column;
    gap:18px;
}
.app-topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 26px;
    border-radius:999px;
    background:linear-gradient(120deg, rgba(15,23,42,0.98), rgba(15,23,42,0.94));
    border:1px solid rgba(148,163,184,0.28);
    box-shadow:0 22px 50px rgba(0,0,0,0.75);
    backdrop-filter:blur(18px);
}
.brand{display:flex;align-items:center;gap:18px;}
.brand-icon{
    width:56px;height:56px;border-radius:999px;overflow:hidden;
    background:radial-gradient(circle at center,#111827,#020617);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 2px rgba(15,23,42,0.9),0 0 26px rgba(56,189,248,0.8);
}
.brand-icon img{
    width:135%;height:auto;object-fit:contain;transform:translateX(1px);
}
.brand-text-title{
    font-size:24px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;
}
.brand-text-sub{font-size:14px;color:var(--text-muted);}
.badge-strip{display:flex;align-items:center;gap:12px;font-size:13px;}
.badge{
    padding:7px 13px;border-radius:999px;border:1px solid rgba(148,163,184,0.4);
    background:radial-gradient(circle at top left,rgba(34,197,94,0.3),rgba(15,23,42,0.99));
    display:flex;align-items:center;gap:7px;
}
.badge-dot{
    width:10px;height:10px;border-radius:999px;
    background:radial-gradient(circle at center,#22c55e,#15803d);
    box-shadow:0 0 10px rgba(34,197,94,0.95);
}
.badge-label{font-size:13px;text-transform:uppercase;letter-spacing:0.2em;}

.app-main{
    flex:1;display:grid;
    grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr);
    gap:18px;min-height:0;
    padding-bottom: 28px;
}
.left-column{display:flex;flex-direction:column;gap:16px;min-height:0;}
.card{
    border-radius:var(--radius-lg);background:var(--bg-elevated);
    border:1px solid rgba(148,163,184,0.28);
    box-shadow:0 26px 70px rgba(0,0,0,0.9),0 0 0 1px rgba(15,23,42,0.9);
    padding:20px 22px;position:relative;overflow:hidden;
}
.card::before{
    content:"";position:absolute;inset:-40%;
    background:radial-gradient(circle at top left,rgba(56,189,248,0.16),transparent 55%);
    opacity:0.8;pointer-events:none;
}
.card-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:14px;}
.card-title{
    font-size:20px;letter-spacing:0.2em;text-transform:uppercase;color:#f9fafb;
    text-shadow:0 0 6px rgba(0,0,0,0.6);
}
.card-subtitle{font-size:14px;color:var(--text-muted);}
.inputs-row{
    display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);
    gap:13px;margin-bottom:10px;
}
input{
    width:100%;padding:14px 16px;
    background:radial-gradient(circle at top left,rgba(15,23,42,0.98),rgba(15,23,42,0.94));
    border:1px solid #4b5563;border-radius:999px;
    color:var(--text-main);font-size:16px;outline:none;
    box-shadow:0 0 0 1px rgba(15,23,42,0.85);
}
input:focus{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent-soft),0 0 16px rgba(56,189,248,0.65);
}
.results-panel{
    margin-top:6px;border-radius:var(--radius-md);
    background:radial-gradient(circle at top left,rgba(15,23,42,0.96),rgba(15,23,42,0.99));
    border:1px solid rgba(31,41,55,0.96);
    max-height:calc(100vh - 280px);
    overflow-y:auto;
    padding:12px 12px 30px 12px;
}
.results-panel::-webkit-scrollbar,
#rightColumn::-webkit-scrollbar{width:9px;}
.results-panel::-webkit-scrollbar-track,
#rightColumn::-webkit-scrollbar-track{background:rgba(15,23,42,0.96);}
.results-panel::-webkit-scrollbar-thumb,
#rightColumn::-webkit-scrollbar-thumb{background:#374151;border-radius:20px;}

.resultBox{
    background:var(--bg-elevated-soft);padding:11px 13px;margin-bottom:9px;
    border-radius:var(--radius-md);border:1px solid var(--border-subtle);
    font-size:15px;cursor:pointer;
}
.result-meta{font-size:13px;color:var(--text-muted);margin-top:4px;}

#rightColumn{
    border-radius:var(--radius-lg);
    background:radial-gradient(circle at top right,rgba(30,64,175,0.68),rgba(15,23,42,0.99));
    border:1px solid rgba(148,163,184,0.34);
    box-shadow:0 28px 76px rgba(0,0,0,0.96),0 0 0 1px rgba(15,23,42,0.9);
    padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;
    min-height:0;overflow-y:auto;
}
.areaHeader{
    font-weight:500;margin-top:4px;padding:7px 9px;
    background:linear-gradient(120deg,rgba(30,64,175,0.97),rgba(37,99,235,0.99));
    cursor:pointer;border-radius:var(--radius-md);border:1px solid #020617;
    display:flex;justify-content:space-between;align-items:center;
    font-size:14px;color:#e5edff;text-shadow:0 0 7px rgba(0,0,0,0.9);
}
.areaHeader span{font-size:12px;color:#cbd5ff;margin-left:6px;}
.machineItem{
    padding:6px 9px;border-bottom:1px solid rgba(15,23,42,0.95);font-size:13px;
}
.machineItem.highlight{background:rgba(56,189,248,0.2);}
.machineItem.jumpHighlight{outline:2px solid var(--accent-gold);}
</style>
</head>
<body>

<div class="app-shell">
<header class="app-topbar">
  <div class="brand">
    <div class="brand-icon"><img src="panther_icon.png" alt="Panther logo"></div>
    <div>
      <div class="brand-text-title">PANTHERS GAME FINDER</div>
      <div class="brand-text-sub">Updated April 2026</div>
    </div>
  </div>
  <div class="badge-strip">
    <div class="badge"><div class="badge-dot"></div><div class="badge-label">Live</div></div>
  </div>
</header>

<main class="app-main">
<section class="left-column">
  <section class="card">
    <div class="card-header">
      <div>
        <div class="card-title">Search</div>
        <div class="card-subtitle">Search by game, link, or machine number.</div>
      </div>
    </div>
    <div class="inputs-row">
      <input id="s" placeholder="Search (e.g. Lucky 88, Dragon, Chilli)…">
      <input id="machineSearch" placeholder="Jump to machine (e.g. 3306)">
    </div>
    <div id="results" class="results-panel"></div>
  </section>
</section>

<aside id="rightColumn">
  <div class="sectionBlock">
    <div id="machineList"></div>
  </div>
</aside>
</main>
</div>

const areaCollapsed = {};
const resultAreaCollapsed = {};

function getArea(loc){
    const n = parseInt(loc, 10);
    if(isNaN(n)) return "Other";
    if(n >= 1051 && n <= 1095) return "Basement Gaming";
    if(n >= 1101 && n <= 1503) return "Main Gaming Floor";
    if(n >= 1701 && n <= 2204) return "Black Panther Room VIP";
    if(n >= 2301 && n <= 6505) return "Main Gaming Floor";
    if(n >= 7001 && n <= 8705) return "Kelly's Gaming";
    return "Other";
}

function jumpToMachine(num){
    num = (num || "").trim();
    if(!num) return;
    const item = document.querySelector('.machineItem[data-location="'+num+'"]');
    if(!item) return;
    const body = item.closest('.areaBody');
    if(body){
        body.style.display = 'block';
        const area = body.getAttribute('data-area');
        if(area){ areaCollapsed[area] = false; }
    }
    item.scrollIntoView({behavior:'smooth', block:'center'});
    item.classList.add('jumpHighlight');
    setTimeout(() => item.classList.remove('jumpHighlight'), 1500);
}

function renderMachineList(filterText=""){
    const ml = document.getElementById('machineList');
    ml.innerHTML = "";
    filterText = (filterText || "").toLowerCase();
    const areaOrder = ["Basement Gaming", "Main Gaming Floor", "Black Panther Room VIP", "Kelly's Gaming", "Other"];
    const groups = {};
    areaOrder.forEach(a => groups[a] = []);

    data.machines.forEach(m => {
        const area = getArea(m.location);
        const searchPool = (m.description + m.location + m.link).toLowerCase();
        const highlight = filterText && searchPool.includes(filterText);
        groups[area].push({location:m.location, description:m.description, highlight, area});
    });

    areaOrder.forEach(area => {
        const list = groups[area];
        if(!list || list.length === 0) return;
        if(!(area in areaCollapsed)) areaCollapsed[area] = true;
        
        const header = document.createElement('div');
        header.className = 'areaHeader';
        header.textContent = area;
        const countSpan = document.createElement('span');
        countSpan.textContent = "(" + list.length + " machines)";
        header.appendChild(countSpan);
        
        const body = document.createElement('div');
        body.className = 'areaBody';
        body.setAttribute('data-area', area);
        list.sort((a,b) => a.location.localeCompare(b.location));
        list.forEach(m => {
            const div = document.createElement('div');
            div.className = 'machineItem';
            div.setAttribute('data-location', m.location);
            if(m.highlight) div.classList.add('highlight');
            div.textContent = m.location + " — " + m.description;
            div.onclick = () => jumpToMachine(m.location);
            body.appendChild(div);
        });
        body.style.display = areaCollapsed[area] ? "none" : "block";
        header.onclick = () => {
            areaCollapsed[area] = !areaCollapsed[area];
            body.style.display = areaCollapsed[area] ? "none" : "block";
        };
        ml.appendChild(header);
        ml.appendChild(body);
    });
}

function search(q){
    q = (q || "").toLowerCase().trim();
    const results = document.getElementById('results');
    if(!q){
        results.innerHTML = "";
        renderMachineList();
        return;
    }
    renderMachineList(q);
    const finalResults = data.machines.filter(m => {
        return (m.description.toLowerCase().includes(q) || 
                m.location.toString().includes(q) || 
                m.link.toLowerCase().includes(q));
    });

    results.innerHTML = "";
    const areaOrder = ["Basement Gaming", "Main Gaming Floor", "Black Panther Room VIP", "Kelly's Gaming", "Other"];
    const areaGroups = {};
    areaOrder.forEach(a => areaGroups[a] = []);
    
    finalResults.forEach(r => {
        const area = getArea(r.location);
        areaGroups[area].push(r);
    });

    areaOrder.forEach(area => {
        const group = areaGroups[area];
        if(!group || group.length === 0) return;
        
        const header = document.createElement('div');
        header.className = 'areaHeader';
        header.style.marginBottom = "8px";
        header.textContent = area;
        const span = document.createElement('span');
        span.textContent = "(" + group.length + " matches)";
        header.appendChild(span);
        results.appendChild(header);

        group.forEach(r => {
            const box = document.createElement('div');
            box.className = 'resultBox';
            box.innerHTML = `
                <div class="result-main">${r.description} on Machine ${r.location}</div>
                <div class="result-meta">${r.link ? 'Link: ' + r.link : 'Standalone'} | ${r.manufacturer}</div>
            `;
            box.onclick = () => jumpToMachine(r.location);
            results.appendChild(box);
        });
    });
}

document.getElementById('s').addEventListener('input', e => search(e.target.value));
document.getElementById('machineSearch').addEventListener('keydown', e => {
    if(e.key === 'Enter'){ jumpToMachine(e.target.value); }
});

renderMachineList();
