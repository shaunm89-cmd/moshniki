<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panthers Game Finder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --panther-black: #000000;
            --panther-teal: #00b2bd; /* Approximation of Panthers teal */
            --glass: rgba(255, 255, 255, 0.95);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 20px; 
            color: #fff;
            background: #0f172a;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #000 100%);
        }
        .bg-glow {
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0, 178, 189, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(80px);
            animation: move 20s infinite alternate;
        }
        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        .header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        .header h1 { 
            font-size: 3.5rem; 
            font-weight: 800; 
            margin: 0; 
            letter-spacing: -2px;
            background: linear-gradient(to right, #fff, var(--panther-teal));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }
        .header p { color: var(--panther-teal); font-weight: 600; letter-spacing: 2px; text-transform: uppercase; margin-top: -5px; opacity: 0.8; }

        .search-wrapper { position: sticky; top: 20px; z-index: 1000; margin-bottom: 40px; }
        #searchInput { 
            width: 100%; max-width: 700px; display: block; margin: 0 auto;
            padding: 20px 30px; font-size: 1.2rem; border: none;
            border-radius: 50px; background: var(--glass);
            color: #000; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            outline: none; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #searchInput:focus { transform: scale(1.02); box-shadow: 0 0 0 5px rgba(0, 178, 189, 0.4); }

        .stats { text-align: center; margin-bottom: 20px; font-size: 0.9rem; color: #94a3b8; }

        .container { max-width: 1100px; margin: 0 auto; }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; }
        th { padding: 15px; text-align: left; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; }
        
        tr.machine-row { background: var(--glass); color: #000; transition: transform 0.2s; }
        tr.machine-row:hover { transform: translateY(-3px) scale(1.01); z-index: 10; }
        
        td { padding: 20px 15px; }
        td:first-child { border-radius: 12px 0 0 12px; font-weight: 800; font-size: 1.2rem; color: var(--panther-teal); }
        td:last-child { border-radius: 0 12px 12px 0; }

        .area-badge { font-size: 0.7rem; font-weight: 700; padding: 4px 10px; border-radius: 50px; background: #e2e8f0; color: #475569; }
        .link-text { font-weight: 800; color: #be185d; font-size: 0.75rem; text-transform: uppercase; }
        
        .game-tag { 
            display: inline-block; padding: 4px 12px; margin: 3px; 
            border-radius: 6px; background: #f1f5f9; color: #334155; 
            font-size: 0.85rem; font-weight: 500; border: 1px solid #e2e8f0;
            transition: all 0.2s;
        }
        
        /* Highlight Class */
        .highlight-game { 
            background: var(--panther-teal) !important; 
            color: #fff !important; 
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0, 178, 189, 0.3);
            border-color: transparent !important;
        }

        @media (max-width: 768px) {
            .header h1 { font-size: 2.2rem; }
            th { display: none; }
            td { display: block; padding: 10px; }
            td:first-child { border-radius: 12px 12px 0 0; }
            td:last-child { border-radius: 0 0 12px 12px; }
        }
    </style>
</head>

        function filterData() {
            const input = document.getElementById('searchInput');
            const filter = input.value.toLowerCase().trim();
            const tbody = document.getElementById('tableBody');
            const stats = document.getElementById('stats');
            
            tbody.innerHTML = '';
            let count = 0;

            data.forEach(item => {
                const gamesStr = item.G.join(' ');
                const match = !filter || 
                              item.L.toLowerCase().includes(filter) ||
                              item.D.toLowerCase().includes(filter) ||
                              item.Area.toLowerCase().includes(filter) ||
                              item.Link.toLowerCase().includes(filter) ||
                              gamesStr.toLowerCase().includes(filter);

                if (match) {
                    count++;
                    const row = document.createElement('tr');
                    row.className = 'machine-row';
                    
                    // Create game tags and highlight if they match the search
                    const gamesHtml = item.G.map(g => {
                        const isMatch = filter && g.toLowerCase().includes(filter);
                        return `<span class="game-tag ${isMatch ? 'highlight-game' : ''}">${g}</span>`;
                    }).join('');

                    row.innerHTML = `
                        <td>${item.L}</td>
                        <td><span class="area-badge">${item.Area}</span></td>
                        <td><div style="font-weight:700">${item.D}</div><div style="font-size:0.7rem; color:#64748b">${item.M}</div></td>
                        <td class="link-text">${item.Link}</td>
                        <td>${gamesHtml || '<span style="color:#94a3b8; font-size:0.8rem; font-style:italic">Stand-alone</span>'}</td>
                    `;
                    tbody.appendChild(row);
                }
            });

            stats.innerText = `Showing ${count} machines`;
        }

        // Initial load
        filterData();
