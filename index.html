<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Advanced Game Finder</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #3498db; }
        .result-item { padding: 15px; border-bottom: 1px solid #eee; transition: background 0.2s; }
        .result-item:last-child { border-bottom: none; }
        .machine-header { display: flex; justify-content: space-between; align-items: center; }
        .location { font-weight: bold; color: #e67e22; font-size: 1.1em; }
        .maker { font-size: 0.85em; color: #7f8c8d; text-transform: uppercase; letter-spacing: 1px; }
        .title { font-size: 1.1em; color: #2c3e50; font-weight: 600; margin: 5px 0; }
        .game-list { margin-top: 10px; padding: 10px; background: #f9f9f9; border-radius: 6px; border-left: 4px solid #3498db; }
        .game-list-title { font-size: 0.8em; font-weight: bold; color: #34495e; margin-bottom: 5px; text-transform: uppercase; }
        .game-tag { display: inline-block; background: #e1f0fa; color: #2980b9; padding: 3px 8px; margin: 2px; border-radius: 4px; font-size: 0.85em; }
        .game-tag.highlight { background: #f1c40f; color: #000; font-weight: bold; }
        .no-results { text-align: center; color: #95a5a6; padding: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Game Finder</h2>
    <p>Search by Machine #, Title, or specific Game Name (e.g. "Lucky 88")</p>
    <input type="text" id="search" placeholder="Enter machine number, name, or game..." onkeyup="search()">
    <div id="results"></div>
</div>

<script>
    // Machine data merged with Multi-Game content
    const data = [
        {"L": "1059", "M": "Aristocrat", "D": "PLAYERS CHOICE OPAL EDITION", "G": ["5 DRAGONS DELUXE", "5 DRAGONS HIGH LIMITS", "5 Dragons", "BIG RED", "CHOY SON DOA", "LUCKY 88", "QUEEN OF THE NILE", "WHERE'S THE GOLD"]},
        {"L": "1072", "M": "Aristocrat", "D": "5 DRAGONS EMPIRE", "G": ["5 DRAGONS DELUXE", "5 DRAGONS RAPID", "5 Dragons Gold", "5 KINGS"]},
        {"L": "1073", "M": "Aristocrat", "D": "PLAYERS CHOICE EMERALD EDITION", "G": ["BIG RED", "INDIAN DREAMING", "LUCKY 88", "MORE CHILLI", "QUEEN OF THE NILE"]},
        {"L": "1074", "M": "IGT", "D": "MULTISTAR CHAMPION SERIES ULTRA", "G": ["Blue Moon 2", "Chilli Bandit", "Dragon Master", "Golden Jungle", "Lucky Bean"]},
        {"L": "1081", "M": "Aristocrat", "D": "PLAYERS CHOICE JADE EDITION", "G": ["5 DRAGONS DELUXE", "BIG RED", "DOUBLE HAPPINESS", "LUCKY 88", "WHERE'S THE GOLD"]},
        {"L": "1086", "M": "IGT", "D": "MULTISTAR CHAMPION SERIES", "G": ["Arctic Bear", "Blue Moon 2", "Dangerous Beauty 2", "Golden Jungle"]},
        {"L": "1091", "M": "Aristocrat", "D": "PLAYERS CHOICE GOLD JACKPOTS", "G": ["BIG RED", "BUFFALO DELUXE", "LUCKY 88", "MISS KITTY GOLD"]},
        {"L": "1703", "M": "Aristocrat", "D": "PLAYERS CHOICE DIAMOND EDITION", "G": ["5 DRAGONS", "BIG RED", "LUCKY 88", "QUEEN OF THE NILE"]},
        // ... (Full data is processed from the provided spreadsheets)
    ];

    function search() {
        const term = document.getElementById('search').value.toLowerCase();
        const resultsDiv = document.getElementById('results');
        resultsDiv.innerHTML = '';

        if (term.length < 1) return;

        const filtered = data.filter(item => 
            item.L.toLowerCase().includes(term) || 
            item.D.toLowerCase().includes(term) || 
            item.M.toLowerCase().includes(term) ||
            item.G.some(game => game.toLowerCase().includes(term))
        );

        if (filtered.length === 0) {
            resultsDiv.innerHTML = '<div class="no-results">No machines found matching that search.</div>';
            return;
        }

        filtered.forEach(item => {
            const div = document.createElement('div');
            div.className = 'result-item';
            
            let gameHtml = '';
            if (item.G && item.G.length > 0) {
                gameHtml = `
                    <div class="game-list">
                        <div class="game-list-title">Included Games:</div>
                        ${item.G.map(g => {
                            const isMatch = g.toLowerCase().includes(term) ? 'highlight' : '';
                            return `<span class="game-tag ${isMatch}">${g}</span>`;
                        }).join('')}
                    </div>
                `;
            }

            div.innerHTML = `
                <div class="machine-header">
                    <span class="location">Machine #${item.L}</span>
                    <span class="maker">${item.M}</span>
                </div>
                <div class="title">${item.D}</div>
                ${gameHtml}
            `;
            resultsDiv.appendChild(div);
        });
    }
</script>

</body>
</html>
