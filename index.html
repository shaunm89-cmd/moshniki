<head>

<title>Panthers Game Finder</title>

<style>
:root{
    --bg-main:#020617;
    --bg-elevated:rgba(15,23,42,0.96);
    --bg-elevated-soft:rgba(15,23,42,0.9);
    --border-subtle:#1f2937;
    --accent:#38bdf8;
    --accent-soft:#0ea5e9;
    --accent-gold:#fbbf24;
    --text-main:#e5e7eb;
    --text-muted:#9ca3af;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:8px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
    font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--text-main);
    background-color:var(--bg-main);
    background-image:url("panthers_bg.jpg");
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    display:flex;
    justify-content:center;
    align-items:stretch;
}
.app-container{
    width:100%;
    max-width:600px;
    background:var(--bg-elevated);
    backdrop-filter:blur(12px);
    display:flex;
    flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,0.5);
    border-left:1px solid var(--border-subtle);
    border-right:1px solid var(--border-subtle);
}
header{
    padding:24px 20px 16px;
    background:linear-gradient(to bottom, rgba(15,23,42,1), var(--bg-elevated));
}
.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
h1{
    margin:0;
    font-size:22px;
    font-weight:700;
    letter-spacing:-0.5px;
    background:linear-gradient(45deg, #fff, #94a3b8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
.badge-strip{
    display:flex;
    gap:8px;
    align-items:center;
}
.pill{
    background:rgba(255,255,255,0.05);
    border:1px solid var(--border-subtle);
    padding:5px 12px;
    border-radius:100px;
    font-size:11px;
    font-weight:600;
    color:var(--text-muted);
    text-transform:uppercase;
}
.pill.accent{
    background:rgba(56,189,248,0.1);
    border-color:rgba(56,189,248,0.3);
    color:var(--accent);
}

.search-box{
    position:relative;
    margin-bottom:12px;
}
input#search{
    width:100%;
    background:rgba(255,255,255,0.03);
    border:1px solid var(--border-subtle);
    border-radius:var(--radius-md);
    padding:16px 20px;
    padding-left:48px;
    color:#fff;
    font-size:16px;
    transition:all 0.2s ease;
    outline:none;
}
input#search:focus{
    border-color:var(--accent);
    background:rgba(255,255,255,0.06);
    box-shadow:0 0 0 4px rgba(56,189,248,0.15);
}
.search-icon{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:var(--text-muted);
}

.scroll-area{
    flex:1;
    overflow-y:auto;
    padding:0 12px 100px;
}
.machine-card{
    background:rgba(30,41,59,0.4);
    border:1px solid var(--border-subtle);
    border-radius:var(--radius-md);
    margin-bottom:10px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:16px;
    transition:transform 0.1s;
}
.loc-circle{
    width:52px;
    height:52px;
    background:linear-gradient(135deg, #1e2937, #0f172a);
    border:1px solid var(--border-subtle);
    border-radius:14px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    flex-shrink:0;
}
.loc-num{font-weight:700; font-size:16px; color:var(--accent);}
.loc-lbl{font-size:8px; text-transform:uppercase; color:var(--text-muted); margin-top:-2px;}

.m-info{flex:1; min-width:0;}
.m-name{font-weight:600; font-size:15px; margin-bottom:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.m-brand{font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px;}

.tag-container{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:8px;
}
.tag{
    font-size:10px;
    background:rgba(251,191,36,0.1);
    color:var(--accent-gold);
    border:1px solid rgba(251,191,36,0.2);
    padding:2px 8px;
    border-radius:4px;
    font-weight:500;
}

#stats{
    padding:10px 20px;
    font-size:12px;
    color:var(--text-muted);
    border-bottom:1px solid var(--border-subtle);
}

.no-results{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
}
</style>
</head>

const listEl = document.getElementById('list');
const statsEl = document.getElementById('stats');
const searchInput = document.getElementById('search');

function render(machines) {
    listEl.innerHTML = '';
    if (machines.length === 0) {
        listEl.innerHTML = '<div class="no-results">No machines found. Try another search.</div>';
        statsEl.textContent = 'No matches found';
        return;
    }
    
    machines.forEach(m => {
        const card = document.createElement('div');
        card.className = 'machine-card';
        
        // Find tags for multi-games
        let tagsHTML = '';
        if (m.description.includes("PLAYERS CHOICE") || m.description.includes("MULTISTAR") || m.description.includes("MEGA MULTIPLAY")) {
            const games = Object.keys(data.catalog).filter(game => data.catalog[game].includes(m.description));
            if (games.length > 0) {
                tagsHTML = `<div class="tag-container">${games.slice(0, 4).map(g => `<span class="tag">${g}</span>`).join('')}${games.length > 4 ? '<span class="tag">...</span>' : ''}</div>`;
            }
        }

        card.innerHTML = `
            <div class="loc-circle">
                <div class="loc-num">${m.location}</div>
                <div class="loc-lbl">Loc</div>
            </div>
            <div class="m-info">
                <div class="m-name">${m.description}</div>
                <div class="m-brand">${m.manufacturer} ${m.link ? '• ' + m.link : ''}</div>
                ${tagsHTML}
            </div>
        `;
        listEl.appendChild(card);
    });
    
    statsEl.textContent = `Showing ${machines.length} machine${machines.length === 1 ? '' : 's'}`;
}

searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    if (!term) {
        render(data.machines);
        return;
    }

    const filtered = data.machines.filter(m => {
        const inName = m.description.toLowerCase().includes(term);
        const inLoc = m.location.toLowerCase().includes(term);
        const inLink = m.link.toLowerCase().includes(term);
        
        // Search inside multi-game packs
        const inCatalog = Object.keys(data.catalog).some(game => 
            game.toLowerCase().includes(term) && data.catalog[game].includes(m.description)
        );

        return inName || inLoc || inLink || inCatalog;
    });

    render(filtered);
});

// Initial load
render(data.machines);
</script>
