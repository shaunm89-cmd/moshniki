<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Austreams Halloween Giveaway</title>

<style>
/* PRIZES CONTAINER */
.prizes-container {
    max-width: 850px;
    margin: 30px auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

/* BASE PRIZE CARD */
.prize-card {
    background: rgba(15, 10, 25, 0.85);
    border: 1px solid rgba(168, 85, 247, 0.4);
    border-radius: 16px;
    padding: 24px;
    text-align: center;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
}

/* 1ST GRAND PRIZE (FULL WIDTH) */
.prize-card.grand-prize {
    border-color: #ff6900;
    box-shadow: 0 0 25px rgba(255, 105, 0, 0.25);
    background: linear-gradient(180deg, rgba(35, 15, 45, 0.9), rgba(15, 10, 25, 0.9));
}

.prize-card.grand-prize .prize-badge {
    color: #ff6900;
}

/* 2ND & 3RD PRIZES (SIDE BY SIDE) */
.prizes-grid-bottom {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

/* BADGES & TYPOGRAPHY */
.prize-badge {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #a855f7;
    margin-bottom: 8px;
}

.prize-card h3 {
    margin: 6px 0;
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
}

.prize-card p {
    margin: 0;
    font-size: 14px;
    color: #d1c4e9;
}

/* MOBILE RESPONSIVE: Stack 2nd and 3rd on small screens */
@media (max-width: 600px) {
    .prizes-grid-bottom {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
<body>

<div class="prizes-container">

    <!-- 1ST GRAND PRIZE (TOP / FULL WIDTH) -->
    <div class="prize-card grand-prize">
        <div class="prize-badge">🏆 1st Grand Prize</div>
        <h3>Formuler Z11 Pro Max + 1 Year Sub</h3>
        <p>Win a brand new Formuler Z11 Pro Max device plus a 1 Year Austreams Subscription.</p>
    </div>

    <!-- 2ND & 3RD PRIZES (SIDE BY SIDE) -->
    <div class="prizes-grid-bottom">
        
        <div class="prize-card">
            <div class="prize-badge">🥈 2nd Prize</div>
            <h3>1 Year Sub</h3>
            <p>1 Year Austreams Subscription.</p>
        </div>

        <div class="prize-card">
            <div class="prize-badge">🥉 3rd Prize</div>
            <h3>1 Year Sub</h3>
            <p>1 Year Austreams Subscription.</p>
        </div>

    </div>

</div>

</body>
</html>
