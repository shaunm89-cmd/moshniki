<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panthers Game Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --panther-teal: #00b2bd;
            --glass: rgba(255, 255, 255, 0.92);
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background: #0f172a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Background image with fade */
        .bg-fixed {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: linear-gradient(rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.6)), url('panthers_bg.jpg');
            background-size: cover;
            background-position: center;
        }

        .layout-wrapper {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        /* Sidebar Sidebar */
        .sidebar {
            width: 280px;
            background: var(--glass);
            border-radius: 15px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
            color: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .sidebar h3 { margin-top: 0; color: #0f172a; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid var(--panther-teal); padding-bottom: 10px; }
        .link-list { list-style: none; padding: 0; margin: 15px 0 0 0; max-height: 70vh; overflow-y: auto; }
        .link-item { 
            padding: 8px 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; 
            font-size: 0.85rem; font-weight: 600; transition: all 0.2s;
            border: 1px solid transparent;
        }
        .link-item:hover { background: #e2e8f0; color: var(--panther-teal); }
        .link-item.active { background: var(--panther-teal); color: white; }

        /* Main Content Area */
        .main-content { flex: 1; }

        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { 
            font-size: 3rem; font-weight: 800; margin: 0; 
            background: linear-gradient(to right, #fff, var(--panther-teal));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-transform: uppercase; letter-spacing: -1px;
        }

        .search-box { 
            width: 100%; padding: 18px 25px; font-size: 1.1rem; border: none;
            border-radius: 50px; background: var(--glass); color: #000;
            box-shadow: 0 15px 30px rgba(0,0,0,0.4); outline: none; margin-bottom: 25px;
        }

        .table-card { background: var(--glass); border-radius: 15px; overflow: hidden; color: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 15px; text-align: left; font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
        
        .machine-row { border-bottom: 1px solid #e2e8f0; transition: background 0.2s; }
        .machine-row:hover { background: #f0fdfa; /* Light teal tint on hover */ cursor: default; }

        td { padding: 15px; vertical-align: top; }
        
        .col-loc { font-weight: 800; color: var(--panther-teal); width: 60px; font-size: 1.1rem; }
        .col-area { width: 180px; } /* Increased width for Area */
        .col-desc { font-weight: 700; width: 220px; }
        .col-link { width: 150px; font-weight: 800; font-size: 0.75rem; color: #be185d; }

        .badge-area { display: inline-block; padding: 4px 12px; border-radius: 50px; background: #0f172a; color: #fff; font-size: 0.7rem; font-weight: 600; white-space: nowrap; }
        
        .game-tag { 
            display: inline-block; padding: 3px 10px; margin: 2px; 
            border-radius: 6px; background: #f1f5f9; color: #334155; 
            font-size: 0.8rem; border: 1px solid #cbd5e1;
        }
        .highlight-game { background: var(--panther-teal) !important; color: #fff !important; border-color: transparent; transform: scale(1.05); }

        .reset-btn { font-size: 0.7rem; float: right; cursor: pointer; color: var(--panther-teal); text-decoration: underline; }

        @media (max-width: 1000px) {
            .layout-wrapper { flex-direction: column; }
            .sidebar { width: 100%; position: static; }
        }
    </style>
</head>

        function handleSearch() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const gamesStr = item.G.join(' ');
                const matchesSearch = !searchVal ||
