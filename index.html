        const searchInput = document.getElementById('searchInput');
        const tableBody = document.getElementById('tableBody');
        const counter = document.getElementById('counter');
        const resultsTable = document.getElementById('resultsTable');
        const noResults = document.getElementById('noResults');

        function updateTable(data) {
            tableBody.innerHTML = '';
            if (data.length === 0) {
                resultsTable.style.display = 'none';
                noResults.style.display = 'block';
                counter.innerText = '0 matches found';
                return;
            }
            resultsTable.style.display = 'table';
            noResults.style.display = 'none';
            counter.innerText = `Showing ${data.length} units`;
            data.forEach(item => {
                const row = `<tr>
                    <td><strong>${item.L}</strong></td>
                    <td><span class="tag">${item.M}</span></td>
                    <td>${item.D}</td>
                </tr>`;
                tableBody.insertAdjacentHTML('beforeend', row);
            });
        }

        updateTable(gameData);

        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase().trim();
            const filtered = gameData.filter(item => 
                item.L.toLowerCase().includes(term) || 
                item.M.toLowerCase().includes(term) || 
                item.D.toLowerCase().includes(term)
            );
            updateTable(filtered);
        });
