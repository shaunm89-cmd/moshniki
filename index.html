        function renderTable(filter = "") {
            const tbody = document.getElementById('tableBody');
            const stats = document.getElementById('stats');
            tbody.innerHTML = '';
            
            const lowerFilter = filter.toLowerCase().trim();
            let count = 0;

            data.forEach(item => {
                const gamesStr = item.G.join(', ');
                const match = !filter || 
                              item.L.toLowerCase().includes(lowerFilter) ||
                              item.M.toLowerCase().includes(lowerFilter) ||
                              item.D.toLowerCase().includes(lowerFilter) ||
                              gamesStr.toLowerCase().includes(lowerFilter);

                if (match) {
                    count++;
                    const row = document.createElement('tr');
                    
                    const gamesHtml = item.G.length > 0 
                        ? item.G.map(g => `<span class="game-tag">${g}</span>`).join('') 
                        : '<span style="color:#ccc">None / Single Game</span>';

                    row.innerHTML = `
                        <td class="location">${item.L}</td>
                        <td>${item.M}</td>
                        <td>${item.D}</td>
                        <td class="game-list">${gamesHtml}</td>
                    `;
                    tbody.appendChild(row);
                }
            });

            stats.innerText = `Showing ${count} of ${data.length} machines`;
            
            if (count === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="no-results">No machines found matching your search.</td></tr>';
            }
        }

        function filterData() {
            const val = document.getElementById('searchInput').value;
            renderTable(val);
        }

        function sortTable(n) {
            const table = document.getElementById("machineTable");
            let rows, switching, i, x, y, shouldSwitch, dir, switchcount = 0;
            switching = true;
            dir = "asc";
            while (switching) {
                switching = false;
                rows = table.rows;
                for (i = 1; i < (rows.length - 1); i++) {
                    shouldSwitch = false;
                    x = rows[i].getElementsByTagName("TD")[n];
                    y = rows[i + 1].getElementsByTagName("TD")[n];
                    if (dir == "asc") {
                        if (x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase()) {
                            shouldSwitch = true;
                            break;
                        }
                    } else if (dir == "desc") {
                        if (x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
                            shouldSwitch = true;
                            break;
                        }
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount ++;
                } else {
                    if (switchcount == 0 && dir == "asc") {
                        dir = "desc";
                        switching = true;
                    }
                }
            }
        }

        renderTable();
    </script>
</body>
</html>
