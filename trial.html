<script>
async function createTrial() {

    const result = document.getElementById("result");
    const button = document.getElementById("createButton");

    button.disabled = true;
    result.innerHTML = "Creating trial account...";

    try {

        const response = await fetch("./create-trial.php", {
            method: "POST"
        });

        const raw = await response.text();

        console.log("HTTP Status:", response.status);
        console.log("Server response:", raw);

        let data;

        try {
            data = JSON.parse(raw);
        } catch (e) {
            result.innerHTML = `
                ❌ Server returned an invalid response.<br><br>
                <strong>HTTP ${response.status}</strong><br><br>
                <pre style="
                    text-align:left;
                    white-space:pre-wrap;
                    background:#111;
                    padding:10px;
                    border-radius:6px;
                    font-size:12px;
                ">${escapeHtml(raw)}</pre>
            `;

            button.disabled = false;
            return;
        }

        if (data.success) {

            result.innerHTML = `
                <strong>✅ Trial Created</strong><br><br>
                Username: <strong>${data.username}</strong><br>
                Password: <strong>${data.password}</strong><br>
                ${data.expiry ? `Expiry: <strong>${data.expiry}</strong>` : ""}
            `;

        } else {

            result.innerHTML = `
                ❌ Error<br><br>
                ${data.error ?? "Unable to create trial."}
                ${data.status ? `<br>HTTP Status: ${data.status}` : ""}
            `;

        }

    } catch (error) {

        console.error(error);

        result.innerHTML = `
            ❌ Could not contact create-trial.php<br><br>
            ${error.message}
        `;

    }

    button.disabled = false;
}


function escapeHtml(text) {

    const div = document.createElement("div");
    div.textContent = text;

    return div.innerHTML;
}
</script>
