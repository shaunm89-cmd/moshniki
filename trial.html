<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reylo TV Trial</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #10131a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .box {
            width: 100%;
            max-width: 420px;
            background: #1a1f2b;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 15px;
            border: 0;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Reylo TV Trial</h1>

    <p>Create a trial account.</p>

    <button onclick="createTrial()" id="createButton">
        Create Trial Account
    </button>

    <div id="result"></div>

</div>

<script>

async function createTrial() {

    const result = document.getElementById("result");
    const button = document.getElementById("createButton");

    button.disabled = true;
    result.innerHTML = "Creating trial account...";

    try {

        const response = await fetch("create-trial.php", {
            method: "POST"
        });

        const data = await response.json();

        if (data.success) {

            result.innerHTML = `
                <strong>✅ Trial Created</strong><br><br>
                Username: <strong>${data.username}</strong><br>
                Password: <strong>${data.password}</strong><br>
                ${data.expiry ? `Expiry: <strong>${data.expiry}</strong>` : ""}
            `;

        } else {

            result.innerHTML =
                "❌ Error: " + (data.error ?? "Unable to create trial.");

        }

    } catch (error) {

        result.innerHTML = "❌ Connection error.";

    }

    button.disabled = false;
}

</script>

</body>
</html>
