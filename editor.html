<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Austreams Giveaway Image Editor</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #0a0512;
      --card-bg: rgba(18, 10, 28, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-orange: #ff6b00;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 5%, rgba(255, 107, 0, 0.3), transparent 55%),
        radial-gradient(circle at 85% 20%, rgba(168, 85, 247, 0.3), transparent 50%),
        linear-gradient(to bottom, rgba(10, 5, 18, 0.5), rgba(10, 5, 18, 0.95));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 5px;
      color: var(--accent-orange);
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }

    h1 {
      font-family: 'Creepster', cursive;
      font-size: 3rem;
      letter-spacing: 2px;
      background: linear-gradient(180deg, #ffe600 0%, #ff6b00 50%, #d93800 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 10px rgba(255, 107, 0, 0.6));
    }

    .editor-layout {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 2rem;
      align-items: start;
    }

    @media (max-width: 900px) {
      .editor-layout {
        grid-template-columns: 1fr;
      }
    }

    /* CANVAS PREVIEW CONTAINER */
    .canvas-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: sticky;
      top: 1rem;
    }

    .canvas-wrapper {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(0,0,0,0.8);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }

    .canvas-tip {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.8rem;
      text-align: center;
    }

    /* CONTROLS PANEL */
    .controls-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="file"],
    select {
      background: rgba(10, 5, 18, 0.8);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-orange);
    }

    .slider-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent-orange);
      cursor: pointer;
    }

    .slider-val {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent-orange);
      width: 40px;
      text-align: right;
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #ff6b00, #ff4500);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.9rem;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 107, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: center;
      text-decoration: none;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 0, 0.6);
    }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 0.2rem 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="brand-title">Austreams Toolsuite</div>
      <h1>Giveaway Image Editor</h1>
    </header>

    <div class="editor-layout">
      
      <!-- Canvas Preview -->
      <div class="canvas-panel">
        <div class="canvas-wrapper">
          <canvas id="editorCanvas" width="1280" height="720"></canvas>
        </div>
        <div class="canvas-tip">💡 Tip: Drag text directly on the canvas to reposition them instantly!</div>
      </div>

      <!-- Controls -->
      <div class="controls-panel">
        
        <div class="control-group">
          <label>1. Upload / Change Image</label>
          <input type="file" id="imageLoader" accept="image/*" />
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label>Select Text to Edit</label>
          <select id="textElementSelect">
            <option value="0">1st Grand Prize</option>
            <option value="1">2nd Prize</option>
            <option value="2">3rd Prize</option>
            <option value="3">End / Draw Date Badge</option>
          </select>
        </div>

        <div class="control-group">
          <label>Text Content</label>
          <input type="text" id="textContentInput" />
        </div>

        <div class="control-group">
          <label>Font Size</label>
          <div class="slider-row">
            <input type="range" id="fontSizeSlider" min="12" max="60" value="26" />
            <span class="slider-val" id="fontSizeVal">26px</span>
          </div>
        </div>

        <div class="divider"></div>

        <div class="control-group">
          <label>Vertical Position (Y)</label>
          <div class="slider-row">
            <input type="range" id="posYSlider" min="50" max="700" value="400" />
            <span class="slider-val" id="posYVal">400</span>
          </div>
        </div>

        <div class="control-group">
          <label>Horizontal Position (X)</label>
          <div class="slider-row">
            <input type="range" id="posXSlider" min="50" max="1230" value="640" />
            <span class="slider-val" id="posXVal">640</span>
          </div>
        </div>

        <div class="divider"></div>

        <a id="downloadBtn" class="btn">📥 DOWNLOAD FINALIZED IMAGE</a>

      </div>

    </div>
  </div>

  <script>
    const canvas = document.getElementById('editorCanvas');
    const ctx = canvas.getContext('2d');

    const imageLoader = document.getElementById('imageLoader');
    const textElementSelect = document.getElementById('textElementSelect');
    const textContentInput = document.getElementById('textContentInput');
    const fontSizeSlider = document.getElementById('fontSizeSlider');
    const fontSizeVal = document.getElementById('fontSizeVal');
    const posYSlider = document.getElementById('posYSlider');
    const posYVal = document.getElementById('posYVal');
    const posXSlider = document.getElementById('posXSlider');
    const posXVal = document.getElementById('posXVal');
    const downloadBtn = document.getElementById('downloadBtn');

    // Default image setup (using placeholder matching user's uploaded image style)
    let bgImage = new Image();
    bgImage.crossOrigin = "anonymous";
    bgImage.src = "https://placehold.co/1280x720/120a1c/ffffff?text=Upload+Your+Halloween+Giveaway+Image";

    // Text elements data
    let textElements = [
      { text: "1st Grand Prize: Formuler Z11 Pro Max + 1 Year Subscription", x: 640, y: 505, size: 28, color: "#ffffff", stroke: "#000000" },
      { text: "2nd Prize: 1 Year Subscription", x: 640, y: 575, size: 26, color: "#ffffff", stroke: "#000000" },
      { text: "3rd Prize: 1 Year Subscription", x: 640, y: 635, size: 26, color: "#ffffff", stroke: "#000000" },
      { text: "Ends 27th Oct • Drawn 28th Oct on Telegram", x: 640, y: 690, size: 22, color: "#ffb703", stroke: "#000000" }
    ];

    let activeIndex = 0;
    let isDragging = false;

    bgImage.onload = function() {
      redrawCanvas();
    };

    imageLoader.addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        bgImage.src = event.target.result;
      }
      if(e.target.files[0]) {
        reader.readAsDataURL(e.target.files[0]);
      }
    });

    function updateControlValues() {
      const active = textElements[activeIndex];
      textContentInput.value = active.text;
      fontSizeSlider.value = active.size;
      fontSizeVal.textContent = active.size + "px";
      posYSlider.value = active.y;
      posYVal.textContent = active.y;
      posXSlider.value = active.x;
      posXVal.textContent = active.x;
    }

    textElementSelect.addEventListener('change', function() {
      activeIndex = parseInt(this.value);
      updateControlValues();
    });

    textContentInput.addEventListener('input', function() {
      textElements[activeIndex].text = this.value;
      redrawCanvas();
    });

    fontSizeSlider.addEventListener('input', function() {
      textElements[activeIndex].size = parseInt(this.value);
      fontSizeVal.textContent = this.value + "px";
      redrawCanvas();
    });

    posYSlider.addEventListener('input', function() {
      textElements[activeIndex].y = parseInt(this.value);
      posYVal.textContent = this.value;
      redrawCanvas();
    });

    posXSlider.addEventListener('input', function() {
      textElements[activeIndex].x = parseInt(this.value);
      posXVal.textContent = this.value;
      redrawCanvas();
    });

    function redrawCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw background image
      ctx.drawImage(bgImage, 0, 0, canvas.width, canvas.height);

      // Draw all text elements
      textElements.forEach((item, index) => {
        ctx.font = `800 ${item.size}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        // Text stroke/shadow for readability
        ctx.lineWidth = Math.max(3, item.size / 6);
        ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
        ctx.strokeText(item.text, item.x, item.y);

        // Fill color
        ctx.fillStyle = item.color;
        ctx.fillText(item.text, item.x, item.y);

        // Highlight box if active
        if (index === activeIndex) {
          const metrics = ctx.measureText(item.text);
          const padding = 10;
          ctx.strokeStyle = "#ff6b00";
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(
            item.x - metrics.width / 2 - padding,
            item.y - item.size / 2 - padding,
            metrics.width + padding * 2,
            item.size + padding * 2
          );
          ctx.setLineDash([]);
        }
      });

      // Update download link
      downloadBtn.href = canvas.toDataURL("image/jpeg", 0.95);
      downloadBtn.download = "austreams-halloween-giveaway.jpg";
    }

    // Interactive Dragging on Canvas
    function getCanvasCoordinates(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.clientX || (e.touches && e.touches[0].clientX);
      const clientY = e.clientY || (e.touches && e.touches[0].clientY);
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    canvas.addEventListener('mousedown', function(e) {
      const pos = getCanvasCoordinates(e);
      // Check which text element was clicked
      textElements.forEach((item, index) => {
        ctx.font = `800 ${item.size}px 'Plus Jakarta Sans', sans-serif`;
        const metrics = ctx.measureText(item.text);
        if (
          pos.x >= item.x - metrics.width / 2 - 20 &&
          pos.x <= item.x + metrics.width / 2 + 20 &&
          pos.y >= item.y - item.size / 2 - 15 &&
          pos.y <= item.y + item.size / 2 + 15
        ) {
          activeIndex = index;
          textElementSelect.value = index;
          updateControlValues();
          isDragging = true;
          redrawCanvas();
        }
      });
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      const pos = getCanvasCoordinates(e);
      textElements[activeIndex].x = Math.round(Math.max(50, Math.min(canvas.width - 50, pos.x)));
      textElements[activeIndex].y = Math.round(Math.max(50, Math.min(canvas.height - 30, pos.y)));
      updateControlValues();
      redrawCanvas();
    });

    window.addEventListener('mouseup', function() {
      isDragging = false;
    });

    // Touch support for mobile dragging
    canvas.addEventListener('touchstart', function(e) {
      const pos = getCanvasCoordinates(e);
      textElements.forEach((item, index) => {
        ctx.font = `800 ${item.size}px 'Plus Jakarta Sans', sans-serif`;
        const metrics = ctx.measureText(item.text);
        if (
          pos.x >= item.x - metrics.width / 2 - 20 &&
          pos.x <= item.x + metrics.width / 2 + 20 &&
          pos.y >= item.y - item.size / 2 - 15 &&
          pos.y <= item.y + item.size / 2 + 15
        ) {
          activeIndex = index;
          textElementSelect.value = index;
          updateControlValues();
          isDragging = true;
          redrawCanvas();
        }
      });
      e.preventDefault();
    });

    window.addEventListener('touchmove', function(e) {
      if (!isDragging) return;
      const pos = getCanvasCoordinates(e);
      textElements[activeIndex].x = Math.round(Math.max(50, Math.min(canvas.width - 50, pos.x)));
      textElements[activeIndex].y = Math.round(Math.max(50, Math.min(canvas.height - 30, pos.y)));
      updateControlValues();
      redrawCanvas();
      e.preventDefault();
    }, { passive: false });

    window.addEventListener('touchend', function() {
      isDragging = false;
    });

    // Initialize
    updateControlValues();
  </script>
</body>
</html>
