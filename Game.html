<!DOCTYPE html>
<html>
<head>
    <title>Gaming Floor Game Finder</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #111;
            color: white;
            text-align: center;
            padding: 40px;
        }

        h1 {
            margin-bottom: 20px;
        }

        input {
            width: 400px;
            padding: 12px;
            font-size: 18px;
            border-radius: 8px;
            border: none;
            outline: none;
        }

        button {
            padding: 12px 20px;
            font-size: 18px;
            margin-left: 10px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .results {
            margin-top: 30px;
            text-align: left;
            display: inline-block;
            max-width: 600px;
        }

        .game-result {
            background: #222;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .machine {
            color: #00ff88;
        }

        .no-result {
            color: #ff4444;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>🎰 Game Finder</h1>

    <input type="text" id="searchInput" placeholder="Type game name (e.g. Lucky 88)">
    <button onclick="findGame()">Search</button>

    <div class="results" id="results"></div>

<script>
/* 
    DATA GENERATED FROM YOUR GAME CATALOGUE
    Format:
    "Game Name": ["Machine Column 1", "Machine Column 2"]
*/

const gameData = {

    "5 Dragons": [
        "5 DRAGONS EMPIRE",
        "5 Dragons Legends",
        "PLAYERS CHOICE DIAMOND EDITION",
        "PLAYERS CHOICE OPAL EDITION",
        "PLAYERS CHOICE SAPPHIRE EDITION"
    ],

    "5 DRAGONS DELUXE": [
        "5 DRAGONS EMPIRE",
        "PLAYERS CHOICE ALL STARS",
        "PLAYERS CHOICE EMERALD EDITION",
        "PLAYERS CHOICE RUBY EDITION"
    ],

    "5 Dragons Gold": [
        "5 DRAGONS EMPIRE"
    ],

    "5 DRAGONS HIGH LIMITS": [
        "5 DRAGONS EMPIRE",
        "PLAYERS CHOICE ULTIMATE JACKPOTS"
    ],

    "5 DRAGONS RAPID": [
        "5 DRAGONS EMPIRE"
    ]

    // ⚠️ ADD THE REST OF YOUR GAMES HERE
    // Same format:
    // "Lucky 88": ["Machine 7012", "Machine 7404"]

};


function findGame() {

    const input = document.getElementById("searchInput").value.toLowerCase().trim();
    const resultsDiv = document.getElementById("results");
    resultsDiv.innerHTML = "";

    if (!input) return;

    let found = false;

    for (let game in gameData) {

        if (game.toLowerCase().includes(input)) {

            found = true;

            let machineList = gameData[game]
                .map(machine => `<div class="machine">• ${machine}</div>`)
                .join("");

            resultsDiv.innerHTML += `
                <div class="game-result">
                    <strong>${game}</strong>
                    <div>${machineList}</div>
                </div>
            `;
        }
    }

    if (!found) {
        resultsDiv.innerHTML = `<div class="no-result">No games found.</div>`;
    }
}
</script>

</body>
</html>
