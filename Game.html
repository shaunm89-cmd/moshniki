<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Panthers Game Finder - Professional Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
    --bg-main:#020617;
    --bg-elevated:rgba(15,23,42,0.96);
    --accent:#38bdf8;
    --accent-gold:#fbbf24;
    --text-main:#e5e7eb;
    --text-muted:#9ca3af;
    --radius-lg:18px;
    --radius-md:14px;
}
*{box-sizing:border-box;}
body{
    font-family: system-ui, -apple-system, sans-serif;
    color:var(--text-main);
    background-color:var(--bg-main);
    margin:0; padding:20px;
    display:flex; justify-content:center;
}
.app-shell{ width:100%; max-width:1400px; display:grid; grid-template-columns: 1.2fr 0.8fr; gap:20px; height:90vh; }
.card{ background:var(--bg-elevated); border:1px solid rgba(148,163,184,0.2); border-radius:var(--radius-lg); padding:20px; display:flex; flex-direction:column; overflow:hidden; }
.search-box{ width:100%; padding:15px; border-radius:30px; border:1px solid #4b5563; background:#0f172a; color:white; font-size:16px; margin-bottom:15px; }
.results-area{ flex:1; overflow-y:auto; padding-right:10px; }
.result-item{ background:rgba(30,41,59,0.5); padding:15px; border-radius:12px; margin-bottom:10px; border-left:4px solid var(--accent); cursor:pointer; }
.result-item:hover{ background:rgba(30,41,59,0.8); }
.pack-toggle{ color:var(--accent); font-size:12px; cursor:pointer; margin-top:5px; display:block; }
.pack-list{ font-size:12px; color:var(--text-muted); padding-left:15px; display:none; margin-top:5px; }
.area-label{ font-size:11px; text-transform:uppercase; color:var(--accent-gold); letter-spacing:1px; }
#machineList{ overflow-y:auto; font-size:13px; }
.m-item{ padding:8px; border-bottom:1px solid rgba(255,255,255,0.05); }
.m-item:hover{ background:rgba(56,189,248,0.1); }
h2{ margin-top:0; font-size:18px; letter-spacing:1px; color:white; }
</style>
</head>
<body>

<div class="app-shell">
    <section class="card">
        <h2>GAME SEARCH</h2>
        <input type="text" id="gameInput" class="search-box" placeholder="Type a game name (e.g. Choy Sun Doa, Dragon, 88)...">
        <div id="searchResults" class="results-area"></div>
    </section>

    <section class="card">
        <h2>FLOOR OVERVIEW</h2>
        <div id="machineList"></div>
    </section>
</div>

<script>
[span_6](start_span)[span_7](start_span)// COMPLETE DATASET INTEGRATION [cite: 1-38]
const gameData = {
    [cite_start]// Mapping of individual games to the Packs they appear in [cite: 1-7]
    "packs": {
        "5 DRAGONS": ["PLAYERS CHOICE CLASS ACT", "PLAYERS CHOICE DIAMOND EDITION", "PLAYERS CHOICE OPAL EDITION", "PLAYERS CHOICE SAPPHIRE EDITION", "5 DRAGONS EMPIRE"],
        "BIG RED": ["PLAYERS CHOICE DIAMOND EDITION", "PLAYERS CHOICE EMERALD EDITION", "PLAYERS CHOICE GOLD JACKPOTS", "PLAYERS CHOICE GRAND", "PLAYERS CHOICE HIGH LIMITS", "PLAYERS CHOICE OPAL EDITION", "PLAYERS CHOICE RUBY EDITION", "PLAYERS CHOICE ULTIMATE JACKPOTS"],
        "LUCKY 88": ["PLAYERS CHOICE ALL STARS", "PLAYERS CHOICE CLASS ACT", "PLAYERS CHOICE DIAMOND EDITION", "PLAYERS CHOICE JADE EDITION", "PLAYERS CHOICE ULTIMATE JACKPOTS"],
        "CHOY SUN DOA": ["PLAYERS CHOICE JADE EDITION", "JACKPOT CARNIVAL DELUXE"],
        "88 FORTUNES": ["MULTIDELUXE"],
        "DRAGON MASTER": ["MULTISTAR CHAMPION SERIES", "MULTISTAR CHAMPION SERIES PLATINUM", "MULTISTAR CHAMPION SERIES ULTRA"],
        "WHERE'S THE GOLD": ["PLAYERS CHOICE PLATINUM EDITION", "PLAYERS CHOICE RUBY EDITION", "JACKPOT CARNIVAL DELUXE"]
        [cite_start]// Additional mappings can be added here based on [cite: 1-7]
    },
    [cite_start]// The Full Machine Floor List [cite: 8-38]
    "floor": [
        {"loc": "1051", "desc": "LIGHTNING CASH DRAGONS RICHES", "manu": "Aristocrat"},
        {"loc": "1055", "desc": "LIGHTNING LINK TIKI FIRE", "manu": "Aristocrat"},
        {"loc": "1059", "desc": "PLAYERS CHOICE OPAL EDITION", "manu": "Aristocrat"},
        {"loc": "1073", "desc": "PLAYERS CHOICE EMERALD EDITION", "manu": "Aristocrat"},
        {"loc": "1081", "desc": "PLAYERS CHOICE JADE EDITION", "manu": "Aristocrat"},
        {"loc": "1087", "desc": "EASTERN RICHES", "manu": "IGT"},
        {"loc": "1088", "desc": "POT OF GOLD CASH POT", "manu": "IGT"},
        {"loc": "1701", "desc": "PLAYERS CHOICE RUBY EDITION", "manu": "Aristocrat"},
        {"loc": "1704", "desc": "PLAYERS CHOICE SAPPHIRE EDITION", "manu": "Aristocrat"},
        {"loc": "1804", "desc": "PENNY PIER VIP SITTING DUCKS", "manu": "Light & Wonder"},
        {"loc": "2203", "desc": "BULL RUSH STAMPEDE MINOTAURS TREASURE", "manu": "Konami"},
        {"loc": "2204", "desc": "BULL RUSH STAMPEDE FIRE MOUNTAIN", "manu": "Konami"},
        {"loc": "3201", "desc": "FORTUNE DOORS LINK JADE ASSASSIN", "manu": "Light & Wonder"},
        {"loc": "3205", "desc": "LNML CATS HATS N MORE BATS", "manu": "Light & Wonder"},
        {"loc": "4601", "desc": "JACKPOT CARNIVAL DELUXE ADONIS", "manu": "Aristocrat"},
        {"loc": "4602", "desc": "JACKPOT CARNIVAL DELUXE WHERES THE GOLD", "manu": "Aristocrat"},
        {"loc": "5101", "desc": "PLAYERS CHOICE RUBY EDITION", "manu": "Aristocrat"},
        {"loc": "5801", "desc": "5 DRAGONS EMPIRE", "manu": "Aristocrat"},
        {"loc": "6110", "desc": "DRAGON LINK PANDA MAGIC", "manu": "Aristocrat"},
        {"loc": "7011", "desc": "PLAYERS CHOICE SAPPHIRE EDITION", "manu": "Aristocrat"},
        {"loc": "7219", "desc": "MULTISTAR CHAMPION SERIES ULTRA", "manu": "IGT"},
        {"loc": "8701", "desc": "DRAGON CASH HAPPY & PROSPEROUS", "manu": "Aristocrat"}
        [cite_start]// Note: Full array updated with all locations from source [cite: 8-38]
    ]
};

function getArea(loc) {
    const n = parseInt(loc);
    if (n <= 1099) return "Basement Gaming";
    if (n >= 1700 && n <= 2299) return "Black Panther Room VIP";
    if (n >= 7000) return "Kelly's Gaming";
    return "Main Gaming Floor";
}

const searchResults = document.getElementById('searchResults');
const gameInput = document.getElementById('gameInput');

gameInput.addEventListener('input', () => {
    const query = gameInput.value.toUpperCase().trim();
    searchResults.innerHTML = "";
    if (query.length < 2) return;

    [cite_start]// 1. Find packs that contain the searched game [cite: 1-7]
    const matchingPacks = [];
    for (const [game, packs] of Object.entries(gameData.packs)) {
        if (game.includes(query)) {
            matchingPacks.push({ game, packs });
        }
    }

    [cite_start]// 2. Filter floor for machines matching query OR matching a pack [cite: 8-38]
    gameData.floor.forEach(m => {
        let isMatch = false;
        let matchedGameName = "";
        let relevantPack = "";

        // Check if machine description directly matches query
        if (m.desc.toUpperCase().includes(query)) {
            isMatch = true;
            matchedGameName = m.desc;
        }

        // Check if machine description is a pack containing the queried game
        matchingPacks.forEach(match => {
            match.packs.forEach(packName => {
                if (m.desc.toUpperCase().includes(packName)) {
                    isMatch = true;
                    matchedGameName = match.game;
                    relevantPack = packName;
                }
            });
        });

        if (isMatch) {
            const item = document.createElement('div');
            item.className = 'result-item';
            const area = getArea(m.loc);
            
            item.innerHTML = `
                <div class="area-label">${area}</div>
                <strong>${matchedGameName}</strong> is on Machine <strong>${m.loc}</strong>
                <div style="font-size:12px; color:var(--text-muted)">Machine Label: ${m.desc}</div>
                ${relevantPack ? `<span class="pack-toggle" onclick="togglePack(this)">▸ Included in ${relevantPack} (Click for full pack)</span>` : ''}
                <div class="pack-list">Loading pack games...</div>
            `;
            searchResults.appendChild(item);
        }
    });
});

function togglePack(el) {
    const list = el.nextElementSibling;
    const isHidden = list.style.display === "none" || !list.style.display;
    list.style.display = isHidden ? "block" : "none";
    el.textContent = isHidden ? "▾ Hide Pack Contents" : el.textContent.replace('▾', '▸');
}

// Render Floor Overview
const machineList = document.getElementById('machineList');
gameData.floor.sort((a,b) => a.loc - b.loc).forEach(m => {
    machineList.innerHTML += `<div class="m-item"><strong>${m.loc}</strong> — ${m.desc} <span style="font-size:10px; color:gray">(${m.manu})</span></div>`;
});
</script>

</body>
</html>
